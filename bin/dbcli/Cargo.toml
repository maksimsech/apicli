[package]
name = "dbcli"
version = "0.1.0"
description = "psql, redis-cli, mongosh, cqlsh and clickhouse-client for databases that need credentials, built for coding agents"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
bson = { version = "3.1", features = ["serde_json-1"] }
bytes = "1.12"
chrono.workspace = true
clap.workspace = true
fallible-iterator = "0.2"
fieldkit-common.workspace = true
fieldkit-policy.workspace = true
fieldkit-vault.workspace = true
mongodb = { version = "3.10", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls-aws-lc", "dns-resolver"] }
percent-encoding.workspace = true
postgres-protocol = "0.6.12"
reqwest.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
unicode-width = "0.2"
url.workspace = true
