[package]
name = "apicli"
version = "0.1.0"
description = "curl for APIs that need credentials, built for coding agents"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
bson = { version = "3.1", features = ["serde_json-1"] }
bytes = "1.12"
fallible-iterator = "0.2"
mongodb = { version = "3.10", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls-aws-lc", "dns-resolver"] }
postgres-protocol = "0.6.12"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false }
unicode-width = "0.2"
apicli-policy.workspace = true
apicli-vault.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
percent-encoding.workspace = true
reqwest.workspace = true
rpassword = "7.4"
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
