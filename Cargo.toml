[workspace]
members = [
    "bin/cli",
    "crates/core",
    "crates/vault",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Maksim Sech"]
repository = "https://github.com/maksimsech/apicli"

[workspace.dependencies]
apicli-core = { path = "crates/core" }
apicli-vault = { path = "crates/vault" }

base64 = "0.22"
percent-encoding = "2.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
