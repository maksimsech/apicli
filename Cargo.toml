[workspace]
members = [
    "bin/cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Maksim Sech"]

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt"] }
url = "2.5"
